# Optional XcodeGen alternative. A generated .xcodeproj is already included.
name: NetScope
options:
  bundleIdPrefix: app.netscope
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  NetScope:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.netscope.iphone
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
  NetScopeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: NetScope
schemes:
  NetScope:
    build:
      targets:
        NetScope: all
    test:
      targets: [NetScopeTests]
